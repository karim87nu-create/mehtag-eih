<!doctype html>
<html lang="ar" dir="rtl"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>تأكيد التنفيذ</title><link rel="stylesheet" href="/static/app.css">
</head><body>
<main class="app">
  <div class="top"><a class="brand" href="/">محتاج إيه؟</a><a class="small" href="/requests/{{ req.id }}">رجوع</a></div>
  <section class="offer-card">
    <div class="eyebrow"><span class="eyebrow-dot"></span> خطوة أخيرة قبل التنفيذ</div>
    <h1>راجع واختار.</h1>
    <p class="muted">{{ req.raw_text }}</p>
    <div class="price">{{ "%.0f"|format(offer.price) }} ج</div>
    <div class="meta-box"><span>موعد التنفيذ</span><b>{{ offer.eta }}</b></div>
    <div class="inline-note">الدفع هنا ما زال محاكاة في النسخة التجريبية. مفيش فلوس حقيقية هتتحرك.</div>
    <form id="confirmForm" method="post" action="/cases/{{ case.id }}/demo-payment">
      <button id="confirmBtn" class="primary" style="width:100%;margin-top:18px">تأكيد تجريبي</button>
    </form>
  </section>
</main>
<script>
(function(){
 const f=document.getElementById("confirmForm"),b=document.getElementById("confirmBtn");
 if(f&&b)f.addEventListener("submit",()=>{b.classList.add("loading");b.disabled=true;b.textContent="بأكد…"});
})();
</script>
</body></html>
