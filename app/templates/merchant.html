<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>طلب حقيقي</title>
<style>body{font-family:Arial;background:#f6f6f6}.box{max-width:620px;margin:60px auto;background:white;padding:30px;border-radius:16px}input,textarea{width:100%;box-sizing:border-box;margin:8px 0 16px;padding:13px;font-size:18px}button{width:100%;padding:14px;font-size:20px}.note{background:#f3f3f3;padding:10px;border-radius:8px}</style><link rel="manifest" href="/static/manifest.webmanifest">
<meta name="theme-color" content="#171717">
<script>if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("/static/sw.js"));}</script>
</head>
<body><div class="box"><h2>طلب حقيقي</h2>
<p><b>المطلوب:</b> {{ req.raw_text }}</p>
{% if req.area %}<p><b>المنطقة:</b> {{ req.area }}</p>{% endif %}
{% if req.budget %}<p><b>ميزانية العميل:</b> حتى {{ req.budget }}</p>{% endif %}
{% if existing %}<div class="note">أرسلت عرضًا قبل كده. يمكنك تحديثه طالما الطلب ما زال مفتوحًا.</div>{% endif %}
<form method="post" action="/r/{{ token }}/offer">
<label>السعر النهائي</label><input name="price" type="number" step="0.01" required value="{{ existing.price if existing else '' }}">
<label>موعد التنفيذ</label><input name="eta" required value="{{ existing.eta if existing else '' }}">
<label>ملاحظات اختيارية</label><textarea name="notes">{{ existing.notes if existing and existing.notes else '' }}</textarea>
<button type="submit">{{ 'تحديث العرض' if existing else 'إرسال العرض' }}</button>
</form></div></body></html>
