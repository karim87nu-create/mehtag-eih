<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>متابعها معاك</title><style>body{font-family:Arial;background:#fafafa;margin:0}.app{max-width:520px;margin:auto;padding:35px 18px}.card{background:white;border:1px solid #e8e8e8;border-radius:22px;padding:22px}.status{background:#f1f1f1;padding:14px;border-radius:14px;margin:16px 0}.btn{width:100%;border:0;border-radius:14px;padding:13px;margin:5px 0;font-size:16px}.muted{color:#666;line-height:1.6}</style><link rel="manifest" href="/static/manifest.webmanifest">
<meta name="theme-color" content="#171717">
<script>if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("/static/sw.js"));}</script>
</head>
<body><main class="app"><a href="/">← الرئيسية</a><div class="card"><h1>{{ case.title }}</h1><p class="muted">{{ case.source_text }}</p>
<div class="status"><b>{{ case.status }}</b><br>المتوقع: {{ case.expected_at or "غير محدد" }}</div>
{% if case.status not in ["VERIFIED_OUTCOME"] %}<h3>خلصت زي المتوقع؟</h3><form method="post" action="/external/{{ case.id }}/outcome"><button class="btn" name="result" value="ok">نعم، تمام</button><button class="btn" name="result" value="issue">فيه مشكلة</button></form>{% else %}<h3>✓ النتيجة اتأكدت.</h3>{% endif %}
</div></main></body></html>
