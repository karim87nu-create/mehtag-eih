<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>الذاكرة</title>
<style>body{font-family:Arial;background:#fafafa}.app{max-width:700px;margin:30px auto}.fact{background:white;border:1px solid #eee;border-radius:14px;padding:14px;margin:10px}</style><link rel="manifest" href="/static/manifest.webmanifest">
<meta name="theme-color" content="#171717">
<script>if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("/static/sw.js"));}</script>
</head>
<body><div class="app"><h1>Outcome Memory — وضع التطوير</h1>{% for f in facts %}<div class="fact"><b>{{ f.key }}</b><br>{{ f.value }}<br><small>{{ f.source_type }} #{{ f.source_id }} — confidence {{ f.confidence }}</small></div>{% else %}<p>لا توجد نتائج مؤكدة محفوظة بعد.</p>{% endfor %}</div></body></html>
