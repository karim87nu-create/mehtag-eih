services:
  - type: web
    name: mehtag-eih
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: test
      - key: APP_BASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: mehtag-eih-db
          property: connectionString

databases:
  - name: mehtag-eih-db
    plan: free
    databaseName: mehtag_eih
    user: mehtag_eih
