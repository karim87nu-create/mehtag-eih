name: Draft cancellation smoke
on:
  push:
    paths:
      - '.github/workflows/live-chat-cancel-smoke.yml'
      - 'app/patched.py'
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Verify cancelling a draft does not execute it
        run: |
          # Production regression check for an abandoned request draft.
          python3 - <<'PY'
          import json, uuid, urllib.request
          base='https://mehtag-eih-experience-production.up.railway.app'
          customer=str(uuid.uuid4())
          thread=None
          def post(text):
              global thread
              body={'message':text,'locale':'ar-EG','client_turn_id':str(uuid.uuid4()),'customer_ref':customer}
              if thread: body['thread_id']=thread
              req=urllib.request.Request(base+'/api/chat',data=json.dumps(body,ensure_ascii=False).encode(),headers={'Content-Type':'application/json','X-Customer-Ref':customer},method='POST')
              with urllib.request.urlopen(req,timeout=90) as r: data=json.loads(r.read().decode())
              thread=thread or data['thread_id']
              print(text, json.dumps(data,ensure_ascii=False))
              return data
          post('عايز لابتوب')
          cancelled=post('خلاص بلاش')
          assert cancelled['action']['status']!='EXECUTED'
          after=post('ابدأ')
          assert after['action']['status']!='EXECUTED', after
          print('CANCEL_SMOKE_PASS=1')
          PY
