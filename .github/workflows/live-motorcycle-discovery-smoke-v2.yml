name: Live motorcycle discovery smoke v2

on:
  push:
    paths:
      - '.github/workflows/live-motorcycle-discovery-smoke-v2.yml'

jobs:
  discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify motorcycle discovery
        run: |
          python3 - <<'PY'
          import json, uuid, urllib.request
          base='https://mehtag-eih-experience-production.up.railway.app'
          customer=str(uuid.uuid4())
          thread=None
          def post(text):
              global thread
              body={'message':text,'locale':'ar-EG','client_turn_id':str(uuid.uuid4()),'customer_ref':customer}
              if thread: body['thread_id']=thread
              req=urllib.request.Request(base+'/api/chat',data=json.dumps(body,ensure_ascii=False).encode(),headers={'Content-Type':'application/json','X-Customer-Ref':customer},method='POST')
              with urllib.request.urlopen(req,timeout=120) as r:
                  data=json.loads(r.read().decode())
              if not thread: thread=data['thread_id']
              return data
          post('عايز موتوسيكل')
          post('مصر الجديدة')
          started=post('ابدأ')
          req=urllib.request.Request(base+'/api/execution/conversations/'+thread,headers={'X-Customer-Ref':customer})
          with urllib.request.urlopen(req,timeout=60) as r:
              execution=json.loads(r.read().decode())
          requests=execution.get('requests') or []
          leads=(requests[0].get('leads') or []) if requests else []
          status=(requests[0].get('status') if requests else None)
          print('STATUS=',status)
          print('MOTORCYCLE_LEADS=',len(leads))
          print('NAMES=',[x.get('name') for x in leads[:8]])
          assert (started.get('action') or {}).get('status')=='EXECUTED', started
          assert status!='DISCOVERY_UNAVAILABLE', execution
          assert len(leads)>=1, execution
          print('MOTORCYCLE_DISCOVERY_PASS=1')
          PY
