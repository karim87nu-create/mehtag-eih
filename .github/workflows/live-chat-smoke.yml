name: Live chat smoke

on:
  push:
    paths:
      - '.github/workflows/live-chat-smoke.yml'
      - 'app/patched.py'
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Run production conversational smoke test
        env:
          BASE_URL: https://mehtag-eih-experience-production.up.railway.app
        run: |
          python3 - <<'PY'
          import json, os, time, uuid, urllib.request, urllib.error

          base = os.environ['BASE_URL'].rstrip('/')

          # The Railway deployment is asynchronous.  Do not accidentally test
          # the previous image: wait until the patched provider is actually live.
          deadline = time.time() + 240
          while True:
              try:
                  with urllib.request.urlopen(base + '/health', timeout=15) as r:
                      health = json.loads(r.read().decode('utf-8'))
                  provider = ((health.get('conversation') or {}).get('provider') or '')
                  print('HEALTH_PROVIDER=' + provider)
                  if provider.startswith('draft-aware('):
                      break
              except Exception as exc:
                  print('WAIT_HEALTH=' + repr(exc))
              if time.time() >= deadline:
                  raise AssertionError('patched deployment did not become live in time')
              time.sleep(10)

          customer = str(uuid.uuid4())
          thread = None
          results = []

          def call(message, turn_id, thread_id=None):
              body = {
                  'message': message,
                  'locale': 'ar-EG',
                  'client_turn_id': turn_id,
                  'customer_ref': customer,
              }
              if thread_id:
                  body['thread_id'] = thread_id
              req = urllib.request.Request(
                  base + '/api/chat',
                  data=json.dumps(body, ensure_ascii=False).encode('utf-8'),
                  headers={
                      'Content-Type': 'application/json; charset=utf-8',
                      'X-Customer-Ref': customer,
                  },
                  method='POST',
              )
              try:
                  with urllib.request.urlopen(req, timeout=90) as r:
                      return r.status, json.loads(r.read().decode('utf-8'))
              except urllib.error.HTTPError as e:
                  raw = e.read().decode('utf-8', errors='replace')
                  print('HTTP_ERROR', e.code, message, raw)
                  raise

          turns = ['عايز موتوسيكل', 'جديد', '70 ألف', 'مصر الجديدة', 'ابدأ', 'شكرا']
          ids = [str(uuid.uuid4()) for _ in turns]
          turn5_envelope = None

          for idx, (message, turn_id) in enumerate(zip(turns, ids), 1):
              status, data = call(message, turn_id, thread)
              if thread is None:
                  thread = data.get('thread_id')
              summary = {
                  'turn': idx,
                  'input': message,
                  'http': status,
                  'thread_id': data.get('thread_id'),
                  'intent': data.get('intent'),
                  'action': data.get('action'),
                  'linked_case': data.get('linked_case'),
                  'card': data.get('card'),
                  'assistant': (data.get('message') or {}).get('content'),
              }
              results.append(summary)
              print('TURN_RESULT=' + json.dumps(summary, ensure_ascii=False))
              assert status == 200
              assert data.get('thread_id') == thread
              if idx == 5:
                  turn5_envelope = data

          # Turns 1-4 are one draft, not independent actions.
          for result in results[:4]:
              assert (result.get('action') or {}).get('status') != 'EXECUTED', result
          assert results[1]['intent'] == 'CONTINUATION', results[1]
          assert results[2]['intent'] == 'CONTINUATION', results[2]
          assert results[3]['intent'] == 'CONTINUATION', results[3]
          assert '70' in (results[2].get('assistant') or ''), results[2]
          assert 'مصر الجديدة' in (results[3].get('assistant') or ''), results[3]

          # Explicit start creates exactly the accumulated request.
          assert (results[4].get('action') or {}).get('status') == 'EXECUTED', results[4]
          title = ((results[4].get('card') or {}).get('title') or '')
          assert 'موتوسيكل' in title, title
          assert '70' in title, title
          assert 'مصر الجديدة' in title, title

          # Exact replay of turn 5 must return the cached envelope and no duplicate.
          retry_status, retry = call('ابدأ', ids[4], thread)
          print('TURN5_RETRY=' + json.dumps(retry, ensure_ascii=False))
          assert retry_status == 200
          assert retry == turn5_envelope, 'Turn 5 retry did not return the exact cached envelope'

          req = urllib.request.Request(
              base + '/api/conversations/' + thread,
              headers={'X-Customer-Ref': customer},
              method='GET',
          )
          with urllib.request.urlopen(req, timeout=60) as r:
              history = json.loads(r.read().decode('utf-8'))
          print('HISTORY=' + json.dumps(history, ensure_ascii=False))

          cases = history.get('cases') or []
          request_cases = [c for c in cases if str(c.get('type', '')).upper() == 'REQUEST']
          print('TEST_CUSTOMER=' + customer)
          print('TEST_THREAD=' + thread)
          print('REQUEST_CASE_COUNT=' + str(len(request_cases)))

          assert len(request_cases) == 1, f'Expected exactly 1 REQUEST case, got {len(request_cases)}: {request_cases}'
          assert (results[-1].get('action') or {}).get('status') != 'EXECUTED', results[-1]
          assert 'متابع الطلب' in (results[-1].get('assistant') or ''), results[-1]

          print('SMOKE_PASS=1')
          PY
